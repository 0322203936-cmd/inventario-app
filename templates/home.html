<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WALMEX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: url('/static/bg_girasoles.png') center center / cover fixed no-repeat;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Capa superpuesta para el fondo difuminado y misterioso */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(15, 20, 30, 0.3) 0%, rgba(5, 10, 15, 0.9) 100%);
            backdrop-filter: blur(12px) brightness(0.6);
            -webkit-backdrop-filter: blur(12px) brightness(0.6);
            z-index: -1;
        }

        /* ── Efecto de Flotación ── */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 32px;
            
            /* Ultra-premium Glassmorphism */
            background: rgba(16, 24, 39, 0.45);
            padding: 48px 32px;
            border-radius: 32px;
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            
            animation: float 6s ease-in-out infinite;
            margin: 20px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-ring {
            width: 84px;
            height: 84px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
            position: relative;
        }
        
        /* Glow detrás del logo */
        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            z-index: -1;
            border-radius: 50%;
        }

        .app-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ── Cards (Botones Oscuros Neón) ── */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            border-radius: 20px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        /* Luces de borde (Glow lines) superiores e inferiores sutiles */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover, .card:active {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card:hover::before, .card:active::before {
            opacity: 1;
        }

        /* ── Colores específicos (Neón) ── */
        /* INVENTARIO (Azul) */
        .card-inventario:hover, .card-inventario:active {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(59, 130, 246, 0.15);
        }
        .card-inventario .icon-box { color: #60a5fa; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); }
        
        /* GASTOS (Naranja/Rojo) */
        .card-gastos:hover, .card-gastos:active {
            border-color: rgba(244, 63, 94, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(244, 63, 94, 0.15);
        }
        .card-gastos .icon-box { color: #fb7185; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); }
        
        /* REPORTE (Verde) */
        .card-reporte:hover, .card-reporte:active {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .card-reporte .icon-box { color: #34d399; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        
        /* FACTURACION (Morado) */
        .card-facturacion:hover, .card-facturacion:active {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .card-facturacion .icon-box { color: #a78bfa; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); }


        /* ── Estructura interna de los botones ── */
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
        }

        .card-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .card-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
        }

        .card-arrow {
            color: rgba(255,255,255,0.2);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .card:hover .card-arrow {
            transform: translateX(4px);
            color: rgba(255,255,255,0.7);
        }

        /* ── Footer ── */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
    <div class="bg-overlay"></div>

    <div class="container">
        
        <div class="header">
            <div class="logo-ring">

                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#ffffff" viewBox="0 0 256 256">

        </div>

        <div class="cards">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">

                    <p class="card-desc">Merma, inventario y cuarto frío</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>

                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>

            <a href="/reporte" class="card card-reporte">
                <div class="icon-box">

                    <h2 class="card-title">Reportes</h2>

                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>

                <div class="card-text">
                    <h2 class="card-title">Facturación</h2>
                    <p class="card-desc">Registro y envío de facturas</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>

        </div>

    </div>
</body>
</html>
