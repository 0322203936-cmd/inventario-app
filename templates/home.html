<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WALMEX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: url('/static/fondo.jpg') center center / cover fixed no-repeat;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Capa superpuesta para el fondo difuminado y misterioso */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* background and filter removed for full visibility */
            z-index: -1;
        }

        /* ── Efecto de Flotación ── */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 32px;
            
            /* Ultra-premium Glassmorphism */
            background: rgba(255, 255, 255, 0.15);
            padding: 48px 32px;
            border-radius: 32px;
            backdrop-filter: blur(25px) saturate(120%);
            -webkit-backdrop-filter: blur(25px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.5);
            
            animation: float 6s ease-in-out infinite;
            margin: 20px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }



        .app-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ── Cards (Botones Oscuros Neón) ── */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            border-radius: 24px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        /* Luces de borde (Glow lines) superiores e inferiores sutiles */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover, .card:active {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card:hover::before, .card:active::before {
            opacity: 1;
        }

        /* ── Colores específicos (Neón) ── */
        /* INVENTARIO (Azul) */
        .card-inventario:hover, .card-inventario:active {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(59, 130, 246, 0.15);
        }
        .card-inventario .icon-box { color: #60a5fa; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); }
        
        /* GASTOS (Naranja/Rojo) */
        .card-gastos:hover, .card-gastos:active {
            border-color: rgba(244, 63, 94, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(244, 63, 94, 0.15);
        }
        .card-gastos .icon-box { color: #fb7185; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); }
        
        /* REPORTE (Verde) */
        .card-reporte:hover, .card-reporte:active {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(16, 185, 129, 0.15);
        }
        .card-reporte .icon-box { color: #34d399; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        
        /* FACTURACION (Morado) */
        .card-facturacion:hover, .card-facturacion:active {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .card-facturacion .icon-box { color: #a78bfa; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); }


        /* ── Estructura interna de los botones ── */
        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
        }

        .card-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .card-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
        }

        .card-arrow {
            color: rgba(255,255,255,0.2);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .card:hover .card-arrow {
            transform: translateX(4px);
            color: rgba(255,255,255,0.7);
        }

        /* ── Footer ── */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
    <div class="bg-overlay"></div>

    <div class="container">
        
        <div class="header">
            <!-- CFBC Logo -->
            <div style="height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; position: relative;">
                <!-- Glow para resaltar el logo -->
                <div style="position: absolute; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.4) 40%, transparent 70%); z-index: -1; border-radius: 50%;"></div>
                <img src="/static/logo.png" alt="CFBC Logo" style="width: 320px; height: 320px; object-fit: contain; max-width: none;">
            </div>
        </div>

        <div class="cards">
            <!-- INVENTARIO -->
            <a href="/inventario" class="card card-inventario">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M223.68,66.15l-88-48.13a15.9,15.9,0,0,0-15.36,0l-88,48.13A15.94,15.94,0,0,0,24,80.12v95.76a15.94,15.94,0,0,0,8.32,14l88,48.13a15.9,15.9,0,0,0,15.36,0l88-48.13a15.94,15.94,0,0,0,8.32-14V80.12A15.94,15.94,0,0,0,223.68,66.15ZM128,31.94,206.12,74.65,128,117.36,49.88,74.65ZM40,175.88V94l80,43.76v81.85Zm176,0-80,43.76V137.79l80-43.76Z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h2 class="card-title">Inventario</h2>
                    <p class="card-desc">Merma, inventario y cuarto frío</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                </div>
            </a>

            <!-- GASTOS -->
            <a href="/gastos" class="card card-gastos">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8H120a8,8,0,0,1,0-16h24A8,8,0,0,0,144,160a24,24,0,0,0-24-24H112a16,16,0,0,1,0-32h16a8,8,0,0,1,0,16H104a8,8,0,0,0,0,16h24a24,24,0,0,0,24,24h8A16,16,0,0,1,144,176ZM136,72v16a8,8,0,0,1-16,0V72a8,8,0,0,1,16,0Z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h2 class="card-title">Gastos</h2>
                    <p class="card-desc">Casetas, comida y otros</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                </div>
            </a>

            <!-- REPORTE -->
            <a href="/reporte" class="card card-reporte">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M224,200h-8V40a8,8,0,0,0-8-8H152a8,8,0,0,0-8,8V200H112V88a8,8,0,0,0-8-8H48a8,8,0,0,0-8,8V200H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM160,48h32V200H160ZM56,96H88V200H56Z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h2 class="card-title">Reportes</h2>
                    <p class="card-desc">Historial de gastos y recibos</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                </div>
            </a>

            <!-- FACTURACION -->
            <a href="/facturacion" class="card card-facturacion">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor">
                        <path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Zm-40-64a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,152Zm0-32a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,120Zm-32,64a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h16A8,8,0,0,1,128,184Z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    <h2 class="card-title">Facturación</h2>
                    <p class="card-desc">Registro y envío de facturas</p>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
                </div>
            </a>
        </div>

    </div>
</body>
</html>
