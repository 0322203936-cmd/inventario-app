<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facturación — WALMEX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background: url('/static/fondo.jpg') center center / cover fixed no-repeat;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* background and filter removed for full visibility */
            z-index: -1;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        /* ── Header ── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(16, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .back-arrow {
            color: rgba(255,255,255,0.7);
            font-size: 24px;
            text-decoration: none;
            line-height: 1;
            transition: color 0.2s;
        }
        .back-arrow:hover { color: #fff; }

        .header-title { flex: 1; }

        .header-title h5 {
            background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-title small {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── Content ── */
        .content-body { 
            padding: 24px; 
            flex: 1; 
            display: flex;
            flex-direction: column;
        }

        /* ── Neon Upload Card ── */
        .upload-card {
            background: rgba(139, 92, 246, 0.05);
            border: 2px dashed rgba(139, 92, 246, 0.4);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
            box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.05);
            backdrop-filter: blur(10px);
        }

        .upload-card:hover, .upload-card:active {
            border-color: rgba(167, 139, 250, 0.8);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.2), inset 0 0 20px rgba(139, 92, 246, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            color: #a78bfa;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }
        
        .upload-title {
            font-weight: 700;
            color: #fff;
            font-size: 16px;
            margin-bottom: 6px;
        }

        #fileInput { display: none; }

        .loading-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background: rgba(16, 24, 39, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        .spinner-border {
            color: #a78bfa;
            width: 3rem; height: 3rem;
            margin-bottom: 20px;
        }

        /* ── Results Info Card ── */
        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(16px);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .info-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .info-label { color: rgba(255,255,255,0.5); font-weight: 500; }
        .info-value { color: #fff; font-weight: 700; }

        .table-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .prod-list { display: flex; flex-direction: column; gap: 12px; }

        .neon-btn {
            width: 100%;
            padding: 16px;
            font-weight: 700;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            margin-bottom: 12px;
        }

        .btn-blue { background: rgba(37, 99, 235, 0.2); border: 1px solid rgba(37, 99, 235, 0.5); color: #60a5fa; box-shadow: 0 0 15px rgba(37, 99, 235, 0.2); }
        .btn-blue:hover { background: rgba(37, 99, 235, 0.4); box-shadow: 0 0 25px rgba(37, 99, 235, 0.4); color: #fff; transform: translateY(-2px); }

        .btn-red { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.5); color: #f87171; box-shadow: 0 0 15px rgba(220, 38, 38, 0.2); }
        .btn-red:hover { background: rgba(220, 38, 38, 0.4); box-shadow: 0 0 25px rgba(220, 38, 38, 0.4); color: #fff; transform: translateY(-2px); }

        .btn-orange { background: rgba(217, 119, 6, 0.2); border: 1px solid rgba(217, 119, 6, 0.5); color: #fbbf24; box-shadow: 0 0 15px rgba(217, 119, 6, 0.2); }
        .btn-orange:hover { background: rgba(217, 119, 6, 0.4); box-shadow: 0 0 25px rgba(217, 119, 6, 0.4); color: #fff; transform: translateY(-2px); }

        .btn-green { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .btn-green:hover { background: rgba(16, 185, 129, 0.4); box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); color: #fff; transform: translateY(-2px); }

        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }

        /* ── Custom Modals ── */
        .glass-modal {
            background: rgba(16, 24, 39, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .glass-modal h5 { color: #fff; font-weight: 800; font-size: 20px; margin-bottom: 10px; }
        .glass-modal p { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 20px; }
        
        .glass-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }
        .glass-input:focus { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.2); }
        .glass-input::placeholder { color: rgba(255,255,255,0.2); }

        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-accept { background: #8b5cf6; color: #fff; box-shadow: 0 4px 15px rgba(139,92,246,0.4); }
        .btn-accept:hover { background: #7c3aed; }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="phone-wrapper">
    <div class="app-header">
        <a href="/" class="back-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
        <div class="header-title">
            <h5>Facturación</h5>
            <small>Registro Seguro</small>
        </div>
    </div>

    <div class="content-body">
        
        <!-- Upload Area -->
        <label for="fileInput" class="upload-card" id="uploadArea">
            <div class="upload-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 256 256"><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"></path></svg>
            </div>
            <div class="upload-title">Subir Factura</div>
            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">Toma una foto clara del documento</div>
        </label>
        <input type="file" id="fileInput" accept="image/*" capture="environment">

        <!-- Loading -->
        <div class="loading-overlay" id="loadingArea">
            <div class="spinner-border" role="status"></div>
            <h6 style="color: #fff; font-weight:700;">Analizando...</h6>
            <p style="font-size: 12px; color: rgba(255,255,255,0.5); text-align: center;">Buscando folio en la base de datos segura</p>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <div class="info-card">
                <div class="info-row">
                    <span class="info-label">Serie detectada</span>
                    <span class="info-value" id="resSerie">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Folio detectado</span>
                    <span class="info-value" id="resFolio">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Fecha</span>
                    <span class="info-value" id="resFecha">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Total</span>
                    <span class="info-value" id="resTotal">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Estado</span>
                    <span class="info-value" id="resDbStatus" style="color: #a78bfa; text-shadow: 0 0 10px rgba(167,139,250,0.5);">--</span>
                </div>
            </div>

            <div class="table-title" style="margin-top: 24px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#a78bfa" viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V72H40V56ZM40,200V88H216V200Zm24-72a8,8,0,0,1,8-8H184a8,8,0,0,1,0,16H72A8,8,0,0,1,64,128Zm0,40a8,8,0,0,1,8-8H184a8,8,0,0,1,0,16H72A8,8,0,0,1,64,168Z"></path></svg>
                Productos en base de datos
            </div>
            <div class="prod-list" id="prodList">
                <!-- Javascript will populate this -->
            </div>
            
            <div id="conciliacionContainer" style="margin-top: 32px;">
                <input type="file" id="reciboInput" accept="image/*" capture="environment" style="display: none;">
                
                <button id="btnEscanearRecibo" class="neon-btn btn-blue">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"></path></svg>
                    Escanear Acuse de Recibo
                </button>
                <button id="btnCancelarFactura" class="neon-btn btn-red">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"></path></svg>
                    Factura Cancelada
                </button>
                <button id="btnSinAcuse" class="neon-btn btn-orange">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z"></path></svg>
                    Falta Folio
                </button>
            </div>
        </div>
        
        <!-- Reconciliation Section -->
        <div id="reconciliationSection" style="display: none;">
            <div class="table-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#34d399" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
                Confirmación de Cantidades
            </div>
            <div class="prod-list" id="reconList">
                <!-- Javascript will populate this -->
            </div>
            <div style="display: flex; gap: 12px; margin-top: 32px;">
                <button id="btnRecibido" class="neon-btn btn-green" style="margin-bottom: 0;">Recibido</button>
                <button id="btnReiniciar" class="neon-btn btn-outline" style="margin-bottom: 0;">Cancelar</button>
            </div>
        </div>

    </div>
</div>

<!-- Modal Folio -->
<div id="folioModal" tabindex="-1" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1050; align-items: center; justify-content: center;">
    <div class="glass-modal">
        <h5>Ingrese el Folio</h5>
        <p>Escriba el número de folio de la factura que acaba de fotografiar.</p>
        <input type="text" id="manualFolioInput" class="glass-input" placeholder="Ej: 12345">
        <div class="modal-buttons">
            <button type="button" class="btn-cancel" id="btnCancelFolio">Cancelar</button>
            <button type="button" class="btn-accept" id="btnSubmitFolio">Aceptar</button>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const reciboInput = document.getElementById('reciboInput');
    const uploadArea = document.getElementById('uploadArea');
    const loadingArea = document.getElementById('loadingArea');
    const resultsSection = document.getElementById('resultsSection');
    const prodList = document.getElementById('prodList');
    const reconList = document.getElementById('reconList');
    const btnEscanearRecibo = document.getElementById('btnEscanearRecibo');
    const btnCancelarFactura = document.getElementById('btnCancelarFactura');
    const btnSinAcuse = document.getElementById('btnSinAcuse');
    const reconciliationSection = document.getElementById('reconciliationSection');
    const btnReiniciar = document.getElementById('btnReiniciar');
    const btnRecibido = document.getElementById('btnRecibido');
    
    let esperados = []; // Para guardar el estado de la factura
    let currentFolio = null;
    let currentSerie = null;
    let currentUrlFactura = null;
    let currentConciliacion = [];
    
    let tempFile = null;
    const folioModal = document.getElementById('folioModal');
    const btnCancelFolio = document.getElementById('btnCancelFolio');
    const btnSubmitFolio = document.getElementById('btnSubmitFolio');
    const manualFolioInput = document.getElementById('manualFolioInput');

    fileInput.addEventListener('change', async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        
        tempFile = e.target.files[0];
        if (!tempFile) return;

        folioModal.style.display = 'flex';
        manualFolioInput.value = '';
        setTimeout(() => manualFolioInput.focus(), 100);
    });

    btnCancelFolio.addEventListener('click', () => {
        folioModal.style.display = 'none';
        fileInput.value = '';
        tempFile = null;
    });

    btnSubmitFolio.addEventListener('click', async () => {
        const manualFolio = manualFolioInput.value.trim();
        if (!manualFolio) {
            alert("Por favor, ingrese el folio.");
            return;
        }

        folioModal.style.display = 'none';

        uploadArea.style.display = 'none';
        resultsSection.style.display = 'none';
        loadingArea.style.display = 'flex';

        const formData = new FormData();
        formData.append('folio_manual', manualFolio);

        try {
            const res = await fetch('/api/analizar_factura', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            loadingArea.style.display = 'none';

            if (!res.ok) {
                alert("Error analizando: " + (data.error || "Desconocido"));
                uploadArea.style.display = 'block';
                return;
            }

            if (data.factura && data.factura.folio === 'No detectado' && data.db_status === 'NOT_FOUND') {
                alert("No se detectó una factura válida o no se pudo leer el folio. Por favor, intenta tomar la foto nuevamente.");
                uploadArea.style.display = 'block';
                return;
            }

            mostrarResultados(data);
        } catch (err) {
            console.error(err);
            alert("Error de conexión al servidor.");
            loadingArea.style.display = 'none';
            uploadArea.style.display = 'block';
        }
    });

    function mostrarResultados(data) {
        resultsSection.style.display = 'block';
        
        currentFolio = data.factura.folio;
        currentSerie = data.factura.serie || 'N/A';
        
        document.getElementById('resSerie').textContent = currentSerie;
        document.getElementById('resFolio').textContent = currentFolio || 'N/A';
        document.getElementById('resFecha').textContent = data.factura.fecha || 'N/A';
        document.getElementById('resTotal').textContent = data.factura.total || 'N/A';
        
        if (data.db_status === 'FOUND') {
            document.getElementById('resDbStatus').textContent = '✅ Folio Encontrado';
            document.getElementById('resDbStatus').style.color = '#10b981';
        } else {
            document.getElementById('resDbStatus').textContent = '❌ Folio NO encontrado';
            document.getElementById('resDbStatus').style.color = '#ef4444';
        }

        prodList.innerHTML = '';
        
        if (data.comparacion && data.comparacion.length > 0) {
            data.comparacion.forEach(item => {
                const card = document.createElement('div');
                const isMatch = item.estado === 'OK';
                
                // Style the card to clearly show DB vs OCR
                card.style.border = '1px solid rgba(255,255,255,0.1)';
                card.style.borderRadius = '16px';
                card.style.padding = '16px';
                card.style.background = 'rgba(255,255,255,0.03)';
                card.style.marginBottom = '12px';
                card.style.backdropFilter = 'blur(10px)';
                card.style.borderLeft = isMatch ? '5px solid #34d399' : '5px solid #f87171';

                card.innerHTML = `
                    <div style="font-weight: 700; color: #fff; font-size: 15px; margin-bottom: 8px;">
                        ${item.producto_db}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: stretch; gap: 10px;">
                        <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                            <div style="font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); margin-bottom: 4px;">DATOS EN BASE DE DATOS</div>
                            <div style="font-size: 13px; color: rgba(255,255,255,0.9);">
                                Cantidad: <b>${item.cantidad_db || 0}</b><br>
                                Precio: <b>$${item.precio_db || 0}</b>
                            </div>
                        </div>
                    </div>
                `;
                prodList.appendChild(card);
            });
        } else {
            prodList.innerHTML = '<div style="text-align:center; padding: 20px; color: #64748b;">No hay productos para comparar.</div>';
        }


        // Save expected products for reconciliation
        esperados = [];
        if (data.comparacion) {
            data.comparacion.forEach(item => {
                esperados.push({
                    producto: item.producto_db,
                    cantidad: item.cantidad_db,
                    precio: item.precio_db
                });
            });
        }
    }
    
    btnEscanearRecibo.addEventListener('click', () => {
        reciboInput.click();
    });

    btnSinAcuse.addEventListener('click', async () => {
        if (!currentFolio) {
            alert("No hay factura escaneada.");
            return;
        }
        
        let razon = prompt("Escribe la razón por la que estás reportando sin folio:");
        if (razon === null) return; // Canceló el prompt
        if (razon.trim() === "") {
            alert("Debes escribir una razón obligatoriamente.");
            return;
        }
        
        // Mostrar loading
        resultsSection.style.display = 'none';
        loadingArea.querySelector('p').textContent = "Guardando justificación...";
        loadingArea.style.display = 'flex';
        
        try {
            const res = await fetch('/api/sin_acuse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folio: currentFolio, razon: razon })
            });
            
            const data = await res.json();
            
            if (data.success) {
                alert("La justificación ha sido guardada en la base de datos.");
                // Reiniciar la vista
                loadingArea.style.display = 'none';
                uploadArea.style.display = 'block';
                document.getElementById('folioInput').value = '';
                currentFolio = null;
            } else {
                alert("Error: " + (data.error || "Ocurrió un problema al guardar"));
                loadingArea.style.display = 'none';
                resultsSection.style.display = 'block'; // Volver a mostrar si falló
            }
        } catch (err) {
            console.error(err);
            alert("Error de conexión al guardar.");
            loadingArea.style.display = 'none';
            resultsSection.style.display = 'block';
        }
    });

    btnCancelarFactura.addEventListener('click', async () => {
        if (!currentFolio) {
            alert("No hay factura escaneada.");
            return;
        }
        
        if (confirm("¿Seguro que quieres cancelar esta factura?")) {
            // Mostrar loading
            resultsSection.style.display = 'none';
            loadingArea.querySelector('p').textContent = "Cancelando factura...";
            loadingArea.style.display = 'flex';
            
            try {
                const res = await fetch('/api/cancelar_factura', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folio: currentFolio, serie: currentSerie })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    alert("La factura ha sido movida a facturas canceladas exitosamente.");
                    // Reiniciar la vista
                    loadingArea.style.display = 'none';
                    uploadArea.style.display = 'block';
                    document.getElementById('folioInput').value = '';
                    currentFolio = null;
                } else {
                    alert("Error: " + (data.error || "Ocurrió un problema al cancelar"));
                    loadingArea.style.display = 'none';
                    resultsSection.style.display = 'block'; // Volver a mostrar si falló
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión al cancelar.");
                loadingArea.style.display = 'none';
                resultsSection.style.display = 'block';
            }
        }
    });

    
    let acuseTempFile = null;

    reciboInput.addEventListener('change', async (e) => {
        if (!e.target.files || e.target.files.length === 0) return;
        acuseTempFile = e.target.files[0];
        
        resultsSection.style.display = 'none';
        
        // Skip OCR and directly build the reconciliation manually
        const fakeData = {
            conciliacion: esperados.map(item => ({
                producto: item.producto,
                esperado: item.cantidad,
                recibido: item.cantidad, // Initially same as expected
                precio: item.precio,
                diferencia: 0,
                estado: 'OK'
            }))
        };
        mostrarConciliacion(fakeData);
    });
    
    function mostrarConciliacion(data) {
        reconciliationSection.style.display = 'block';
        reconList.innerHTML = '';
        
        currentConciliacion = data.conciliacion || [];
        
        if (currentConciliacion.length > 0) {
            currentConciliacion.forEach((item, index) => {
                const card = document.createElement('div');
                card.style.border = '1px solid rgba(255,255,255,0.1)';
                card.style.borderRadius = '16px';
                card.style.padding = '16px';
                card.style.background = 'rgba(255,255,255,0.03)';
                card.style.marginBottom = '12px';
                card.style.backdropFilter = 'blur(10px)';
                
                card.innerHTML = `
                    <div style="font-weight: 700; color: #fff; font-size: 15px; margin-bottom: 8px;">
                        ${item.producto}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <div style="text-align: center; flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.05);">
                            <div style="font-size: 10px; color: rgba(255,255,255,0.5); font-weight: bold;">FACTURADO</div>
                            <div style="font-size: 16px; font-weight: bold; color: #fff;">${item.esperado}</div>
                        </div>
                        <div style="text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; border: 1px solid rgba(255,255,255,0.05);">
                            <button type="button" class="btn btn-sm btn-outline-light btn-dec" data-index="${index}" style="font-weight:bold; width: 30px; border-radius: 8px; border-color: rgba(255,255,255,0.2); color:#fff;">-</button>
                            <div style="font-size: 18px; font-weight: bold; color: #34d399; min-width: 30px; text-shadow: 0 0 10px rgba(52,211,153,0.4);" id="qty-${index}">${item.recibido}</div>
                            <button type="button" class="btn btn-sm btn-outline-light btn-inc" data-index="${index}" style="font-weight:bold; width: 30px; border-radius: 8px; border-color: rgba(255,255,255,0.2); color:#fff;">+</button>
                        </div>
                    </div>
                    <div id="diff-container-${index}" style="display:none; font-size: 13px; padding: 6px 10px; border-radius: 8px; text-align: center; border: 1px solid transparent; margin-top: 10px;">
                        <span id="diff-msg-${index}"></span>
                        <div id="diff-reason-${index}" style="margin-top: 8px; text-align: left; display: none;">
                            <label style="font-size: 11px; color: rgba(255,255,255,0.7); display: block; margin-bottom: 4px;">Razón de merma:</label>
                            <select id="reason-sel-${index}" style="width: 100%; padding: 6px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-size: 13px;" onchange="currentConciliacion[${index}].razon_devolucion = this.value">
                                <option value="" disabled selected>Selecciona un motivo...</option>
                                <option value="Calidad">Calidad</option>
                                <option value="No empacado">No empacado</option>
                                <option value="Maltratado">Maltratado</option>
                            </select>
                        </div>
                    </div>
                `;
                reconList.appendChild(card);
            });

            // Bind buttons
            document.querySelectorAll('.btn-dec').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    if(currentConciliacion[idx].recibido > 0) {
                        currentConciliacion[idx].recibido -= 1;
                        document.getElementById('qty-'+idx).innerText = currentConciliacion[idx].recibido;
                        updateColor(idx);
                    }
                });
            });
            document.querySelectorAll('.btn-inc').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    currentConciliacion[idx].recibido += 1;
                    document.getElementById('qty-'+idx).innerText = currentConciliacion[idx].recibido;
                    updateColor(idx);
                });
            });

            function updateColor(idx) {
                const item = currentConciliacion[idx];
                const el = document.getElementById('qty-'+idx);
                const diffCont = document.getElementById('diff-container-'+idx);
                const diffMsg = document.getElementById('diff-msg-'+idx);
                const diffReason = document.getElementById('diff-reason-'+idx);
                const diff = item.esperado - item.recibido;
                
                if (item.recibido < item.esperado) {
                    el.style.color = '#fbbf24';
                    el.style.textShadow = '0 0 10px rgba(251,191,36,0.4)';
                    diffCont.style.display = 'block';
                    diffCont.style.background = 'rgba(217, 119, 6, 0.2)';
                    diffCont.style.borderColor = 'rgba(217, 119, 6, 0.5)';
                    diffCont.style.color = '#fbbf24';
                    diffMsg.innerHTML = `⚠️ Devolución de ${diff} unidades`;
                    diffReason.style.display = 'block';
                    if(item.razon_devolucion) document.getElementById('reason-sel-'+idx).value = item.razon_devolucion;
                } else if (item.recibido > item.esperado) {
                    el.style.color = '#60a5fa';
                    el.style.textShadow = '0 0 10px rgba(96,165,250,0.4)';
                    diffCont.style.display = 'block';
                    diffCont.style.background = 'rgba(37, 99, 235, 0.2)';
                    diffCont.style.borderColor = 'rgba(37, 99, 235, 0.5)';
                    diffCont.style.color = '#60a5fa';
                    diffMsg.innerHTML = `⚠️ Sobran ${-diff} unidades`;
                    diffReason.style.display = 'none';
                } else {
                    el.style.color = '#34d399';
                    el.style.textShadow = '0 0 10px rgba(52,211,153,0.4)';
                    diffCont.style.display = 'block';
                    diffCont.style.background = 'rgba(16, 185, 129, 0.2)';
                    diffCont.style.borderColor = 'rgba(16, 185, 129, 0.5)';
                    diffCont.style.color = '#34d399';
                    diffMsg.innerHTML = `✅ Cantidad Coincide`;
                    diffReason.style.display = 'none';
                }
            }

            // Inicializar colores y diferencias
            currentConciliacion.forEach((_, index) => {
                updateColor(index);
            });

        } else {
            reconList.innerHTML = '<div style="text-align:center; padding: 20px; color: #64748b;">No hay productos para conciliar.</div>';
        }
    }
    
    btnRecibido.addEventListener('click', async () => {
        if (!currentFolio || currentFolio === 'No detectado') {
            alert('No se puede actualizar sin un folio válido.');
            return;
        }
        
        // We will send all the products final quantities to the backend
        const payloadProductos = currentConciliacion.map(item => ({
            producto: item.producto,
            esperado: item.esperado,
            nueva_cantidad: item.recibido,
            precio: item.precio,
            razon_devolucion: item.razon_devolucion || ''
        }));
        
        const prevText = btnRecibido.innerHTML;
        btnRecibido.innerHTML = '⏳ Guardando...';
        btnRecibido.disabled = true;

        const formData = new FormData();
        if (tempFile) {
            formData.append('imagen_factura', tempFile);
        }
        if (acuseTempFile) {
            formData.append('imagen_acuse', acuseTempFile);
        }
        formData.append('folio', currentFolio);
        formData.append('serie', currentSerie);
        formData.append('productos', JSON.stringify(payloadProductos));
        
        try {
            const res = await fetch('/api/actualizar_recibo', {
                method: 'POST',
                body: formData
            });
            
            const resultData = await res.json();
            if (resultData.ok) {
                alert('¡Cantidades actualizadas exitosamente en la base de datos!');
                btnReiniciar.click();
            } else {
                alert('Error al actualizar: ' + resultData.error);
                btnRecibido.innerHTML = prevText;
                btnRecibido.disabled = false;
            }
        } catch (err) {
            console.error(err);
            alert('Error de conexión al guardar.');
            btnRecibido.innerHTML = prevText;
            btnRecibido.disabled = false;
        }
    });
    
    btnReiniciar.addEventListener('click', () => {
        reconciliationSection.style.display = 'none';
        resultsSection.style.display = 'none';
        uploadArea.style.display = 'block';
        fileInput.value = '';
        reciboInput.value = '';
        btnRecibido.innerHTML = 'Recibido';
        btnRecibido.disabled = false;
    });
</script>

</body>
</html>
